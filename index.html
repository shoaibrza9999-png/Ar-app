<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>AR Trace App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <video id="camera-stream" autoplay playsinline></video>

    <div id="canvas-container">
      <canvas id="overlay-canvas"></canvas>
    </div>

    <div id="controls-panel">
      <h3>Controls</h3>
      <button id="lock-btn">Lock Image</button>
      <button id="unlock-btn" style="display: none">Unlock Controls</button>

      <div id="settings-group">
        <div class="control-group">
          <label for="image-upload">Upload Image:</label>
          <input type="file" id="image-upload" accept="image/*" />
        </div>

        <div class="control-group">
          <label for="opacity-slider"
            >Opacity: <span id="opacity-val">50%</span></label
          >
          <input
            type="range"
            id="opacity-slider"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
          />
        </div>

        <div class="control-group">
          <label for="scale-slider"
            >Scale: <span id="scale-val">1.0x</span></label
          >
          <input
            type="range"
            id="scale-slider"
            min="0.1"
            max="5"
            step="0.1"
            value="1"
          />
        </div>

        <div class="control-group">
          <label for="color-picker">Transparent Color:</label>
          <input type="color" id="color-picker" value="#ffffff" />
        </div>

        <div class="control-group">
          <label for="tolerance-slider"
            >Color Tolerance: <span id="tolerance-val">10</span></label
          >
          <input
            type="range"
            id="tolerance-slider"
            min="0"
            max="255"
            step="1"
            value="10"
          />
        </div>
        <button id="reset-btn">Reset Size & Position</button>
      </div>
    </div>

    <!-- Hidden image element to load the original image before processing -->
    <img
      id="source-image"
      src="cat.png"
      style="display: none"
      crossorigin="anonymous"
    />

    <script src="script.js"></script>
  </body>
</html>
